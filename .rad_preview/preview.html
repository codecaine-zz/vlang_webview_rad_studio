<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAD Studio Exported Form</title>
<style>
:root {
	--bg-main: #0f172a;
	--text-main: #f8fafc;
	--accent: #38bdf8;
	--card-bg: #1e293b;
	--border-color: rgba(255, 255, 255, 0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body {
	background-color: var(--bg-main);
	color: var(--text-main);
	padding: 24px;
	min-height: 100vh;
}
.header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding-bottom: 16px;
	border-bottom: 1px solid var(--border-color);
	margin-bottom: 24px;
}
.header h1 { font-size: 20px; color: var(--accent); }
.card {
	background-color: var(--card-bg);
	border: 1px solid var(--border-color);
	border-radius: 8px;
	padding: 20px;
	margin-bottom: 16px;
}
.btn {
	background-color: var(--accent);
	color: #000;
	border: none;
	padding: 8px 16px;
	border-radius: 6px;
	font-weight: 600;
	cursor: pointer;
}
.btn:hover { filter: brightness(1.1); }
pre {
	background: rgba(0,0,0,0.3);
	padding: 12px;
	border-radius: 6px;
	overflow-x: auto;
	font-size: 13px;
}
</style>
</head>
<body>
<div class="header">
	<h1>⚡ RAD Studio Live Form</h1>
	<button class="btn" onclick="window.quitApp ? window.quitApp() : window.close()">Close</button>
</div>
<div class="card">
	<p style="margin-bottom: 12px;">Active RAD Form Specification:</p>
	<pre id="specPre"></pre>
</div>
<script>
try {
	const spec = {"title":"Form1","width":800,"height":600,"background_color":"#0f172a","font_color":"#e2e8f0","padding":20,"spacing":12,"controls":[]};
	document.getElementById("specPre").textContent = JSON.stringify(spec, null, 2);
} catch (e) {
	document.getElementById("specPre").textContent = "Spec loaded successfully.";
}
</script>
</body>
</html>
